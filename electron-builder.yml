appId: com.laminef.claudex
productName: Claudex
copyright: Claudex

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

# node-pty embarque un binaire natif et un `spawn-helper` exécutable : dans une
# archive asar ils ne sont ni chargeables ni exécutables. Sur Windows, la même
# règle couvre conpty.dll, OpenConsole.exe et winpty-agent.exe.
asarUnpack:
  - node_modules/node-pty/**

# Pas de recompilation à l'empaquetage : elle a déjà eu lieu à l'installation, où
# `scripts/apres-installation.mjs` appelle `electron-builder install-app-deps` sur
# macOS. La refaire ici ne changerait rien, et sur Windows elle échoue faute de
# Python et des outils de Visual Studio — pour rien, node-pty étant en Node-API.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.png
  darkModeSupport: true
  # Aucun certificat de développeur ici : signer avec un vrai certificat
  # échouerait et empêcherait l'application d'être construite. macOS demandera
  # confirmation au premier lancement, ce qui est le comportement attendu pour
  # une application locale.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Pas de certificat de signature : Windows montrera un avertissement SmartScreen
  # au premier lancement, comme macOS demande confirmation. Rien à cacher, et
  # signer avec un certificat absent ferait échouer la construction.

nsis:
  # Installation pour l'utilisateur courant : demander l'élévation pour un IDE
  # posé dans son propre dossier n'apporte rien et bloque qui n'est pas
  # administrateur de sa machine.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Claudex

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Un dossier de tailles, et non le seul `build/icon.png` des deux autres
  # systèmes. Fourni en 1024 il n'était installé que dans `hicolor/1024x1024`,
  # que le thème de Debian 13 ne déclare pas dans son `index.theme` : GTK n'y
  # entrait jamais, l'icône était introuvable à toutes les tailles demandées, et
  # le bureau retombait sur la générique. `node scripts/icone.mjs` le fabrique,
  # en même temps que `build/icon.png`, et son contenu est versionné comme lui.
  icon: build/icons
  # Catégorie freedesktop, et non la nomenclature d'Apple juste au-dessus : les
  # menus de bureau ne rangent l'application que s'ils la reconnaissent.
  category: Development
  synopsis: IDE dont l'unité de base est la conversation d'agent
  # Le bureau relie une fenêtre à son lanceur en comparant deux noms. Sans cette
  # option ils diffèrent, et l'icône reste générique dans le dock comme dans le
  # sélecteur de fenêtres. Le nom retenu est celui de l'exécutable, `claudex`.
  syncDesktopName: true

deb:
  # Un paquet Debian doit nommer un mainteneur. L'adresse de redirection que
  # GitHub réserve au compte évite d'inscrire une adresse personnelle dans un
  # dépôt public ; elle se remplace par la vôtre le jour d'une vraie diffusion.
  maintainer: lamine-f <lamine-f@users.noreply.github.com>
  # La liste par défaut d'electron-builder est reprise telle quelle, tmux en
  # plus : sans lui aucun terminal ne s'ouvre, et l'application se réduit à son
  # écran de diagnostic. La répéter est le prix à payer pour ajouter une ligne,
  # `depends` remplaçant la valeur par défaut au lieu de s'y ajouter.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - tmux

# Le dossier de sortie est retiré de l'index de Spotlight avant d'être rempli :
# sans cela, une recherche remonte l'application installée et sa copie de
# construction, et l'on lance l'une pour l'autre.
beforePack: build/avant-paquet.mjs

# Une identité de code, il en faut une : sans elle le paquet garde celle du
# binaire Electron, sa signature ne vérifie pas, et macOS lui refuse les
# notifications en silence. Le crochet la pose en ad hoc, avant le DMG.
afterPack: build/apres-paquet.mjs

dmg:
  title: Claudex
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
